name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "Windows"
          os: windows-latest
        - name: "macOS"
          os: macos-latest
        - name: "Android32"
          os: ubuntu-latest
        - name: "Android64"
          os: ubuntu-latest
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          cli-args: --config ${{ matrix.config.name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }} Build
          path: ./build/*.geode
  combine:
    name: Combine Builds
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./builds/
      - name: Combine Builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          build-folder: ./builds/
          out-file: ./toro-mod.geode
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./*.geode
